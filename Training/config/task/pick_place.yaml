name: pick_place # <-------------------- SET TASK NAME HERE - use the same name in workspace.yaml file

image_shape: [3, 256, 320]
dataset_path: /media/Data/demoaccount2/Fall_2025/NRC_Diffusion_Policy_2.0/Data_Collection/Collected_Data/pick_place_50 #  <-------------------- SET DATASET PATH HERE

shape_meta: &shape_meta
  # acceptable types: rgb, low_dim
  obs:
    camera_0:
      shape: ${task.image_shape}
      type: rgb
    camera_1:
      shape: ${task.image_shape}
      type: rgb
    robot_eef_pose:
      shape: [6]
      type: low_dim
    robot_gripper_state:
      shape: [1]
      type: low_dim
    start_pose:
      shape: [6]
      type: low_dim
  action: 
    shape: [7]
    type: low_dim
    
env_runner:
  _target_: Training.env_runner.real_pusht_image_runner.RealPushTImageRunner

dataset:
  _target_: Training.dataset.relative_dataset.GripperTestRelative # <-------------------- CHANGE DATASET CONVERSION CLASS HERE
  shape_meta: *shape_meta
  dataset_path: ${task.dataset_path}
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  n_latency_steps: ${n_latency_steps}
  use_cache: True
  seed: 42
  val_ratio: 0.05
  max_train_episodes: null
  delta_action: False #  <-------------------- KEEP AS FALSE (Needs to debugged in conversion class)

